<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Md Shahabuddin — Full Stack Developer building production web and Android apps with React, React Native and Node.js."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <title>Md Shahabuddin — Full Stack Developer</title>
  </head>

    <div id="root"></div>
